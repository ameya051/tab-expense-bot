# Production stack: Postgres + app + Caddy (HTTPS via Let's Encrypt).
# Deploy with scripts/deploy.sh. Values like ${POSTGRES_PASSWORD} come from .env.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # logs include message text; keep them bounded
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"   # host-only, for health checks; Caddy is the public entry
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:

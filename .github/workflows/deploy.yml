# Deploy to the EC2 box on every push to main by running scripts/deploy.sh through
# AWS Systems Manager. No inbound SSH: the instance's SSM agent pulls the command.
# GitHub authenticates to AWS with OIDC; the role it assumes may only run the
# ExpenseBotDeploy SSM document on this one instance.
# Secrets (Settings → Secrets and variables → Actions):
#   AWS_DEPLOY_ROLE_ARN  IAM role trusted for this repo's main branch
#   EC2_INSTANCE_ID      the bot's instance
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; queue the newer one instead of cancelling mid-migration.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Run deploy.sh on the server
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          cmd_id=$(aws ssm send-command \
            --document-name ExpenseBotDeploy \
            --instance-ids "$INSTANCE_ID" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          echo "SSM command $cmd_id"

          # The invocation may not exist for a moment after send-command.
          while true; do
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "status: $status"
          [ "$status" = Success ]
